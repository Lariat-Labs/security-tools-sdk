[project]
name = "secctl"
version = "0.1.0"
description = "Command-line interface for secsdk. Every SDK operation becomes a command with JSON output."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "secsdk",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
secctl = "secctl.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secctl"]
