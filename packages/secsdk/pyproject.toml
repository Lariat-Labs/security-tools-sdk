[project]
name = "secsdk"
version = "0.1.0"
description = "A structured, provider-based Python SDK for security data: vulnerabilities, OSINT, SEC filings, threat feeds, Tenable and Azure."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Tracing/metrics hooks (API only; no-ops until an app configures an exporter).
otel = ["opentelemetry-api>=1.27"]
# Export to any OTLP backend / OpenTelemetry Collector, or to a JSON-lines file.
otlp = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# Export to Azure Monitor / Application Insights.
azure-monitor = ["opentelemetry-api>=1.27", "azure-monitor-opentelemetry>=1.6"]
# Managed identity / DefaultAzureCredential for the azure provider.
azure = ["azure-identity>=1.17"]

# Third-party packages can add providers without touching this repo:
#   [project.entry-points."secsdk.providers"]
#   myprovider = "my_package.providers:MyProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secsdk"]
