site_name: security-tools-sdk
site_description: A structured Python SDK and CLI for security data (vulnerabilities, OSINT, SEC filings, threat news, Tenable, Azure), built so an agent can drive it.
repo_url: https://github.com/Lariat-Labs/security-tools-sdk
repo_name: Lariat-Labs/security-tools-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

hooks:
  - docs/hooks/reference.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/secsdk/src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Providers: providers.md
  - CLI: cli.md
  - Using with agents: agents.md
  - Observability: observability.md
  - Deploy to Azure (MCP + Foundry): deploy-azure.md
  - Agent gateway (APIM proposal): agent-gateway.md
  - Agent gateway field manual:
      - field-manual/index.md
      - 00 The big picture: field-manual/00-big-picture.md
      - 01 The SDK and CLI: field-manual/01-sdk.md
      - 02 Identity and tokens: field-manual/02-identity.md
      - 03 The APIM front door: field-manual/03-front-door.md
      - 04 Token limits: field-manual/04-limits.md
      - 05 The agent runtime: field-manual/05-runtime.md
      - 06 Models and quota: field-manual/06-models.md
      - 07 OBO and the web chat: field-manual/07-obo.md
      - 08 The Teams bot: field-manual/08-teams.md
      - 09 Observability: field-manual/09-observability.md
      - 10 Cost and chargeback: field-manual/10-cost.md
      - 11 Infrastructure as code: field-manual/11-iac.md
      - 12 Copilot Studio (A2A): field-manual/12-copilot-studio.md
      - 13 Wrap-up and teardown: field-manual/13-wrap-up.md
  - Extending the SDK: extending.md
  - Reference:
      - Operations: reference/operations.md
      - Python API: reference/python-api.md
  - Responsible use: responsible-use.md
  - Contributing: contributing.md
